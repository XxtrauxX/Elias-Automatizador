<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Elias Cobranza</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: #fff;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 15px;
            display: block;
        }
        .sidebar a:hover {
            color: #fff;
            background-color: #495057;
        }
        .card-stats {
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-icon {
            font-size: 2rem;
            color: rgba(255,255,255,0.8);
        }
        .table-container {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar p-3" style="width: 250px;">
        <h4 class="text-center mb-4">Elias Admin</h4>
        <a href="#"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="#"><i class="fas fa-users me-2"></i> Clientes</a>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1 p-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Portafolio</h2>
            <div>
                <button id="btnIniciarBatch" class="btn btn-success btn-lg shadow-sm" onclick="lanzarCicloCobranza()">
                    <i class="fas fa-play-circle me-2"></i> Iniciar Ciclo de Cobranza
                </button>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="row">
            <div class="col-md-3">
                <div class="card card-stats bg-primary text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase text-white-50">Total Clientes</h6>
                            <h2 class="mb-0" th:text="${totalClientes}">0</h2>
                        </div>
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stats bg-danger text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase text-white-50">Gestionados</h6>
                            <h2 class="mb-0" th:text="${totalMora}">0</h2>
                        </div>
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container mt-4">
            <h5 class="mb-3">Lista de Contactos</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle flex-nowrap">
                    <thead class="table-light">
                        <tr>
                            <th>NIT</th>
                            <th>Empresa / Nombre</th>
                            <th>Correo Electrónico</th>
                            <th>Última Gestión</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="contacto : ${contactos}" th:id="'row-' + ${contacto.id}">
                            <td th:text="${contacto.nit}">-</td>
                            <td class="td-nombre" th:text="${contacto.nombreEmpresa}">-</td>
                            <td class="td-correo" th:text="${contacto.correo}">-</td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${contacto.ultimaGestion != null ? contacto.ultimaGestion : 'Sin gestión previa'}"></span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" th:onclick="'abrirModalEdicion(' + ${contacto.id} + ')'">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contactos)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay contactos registrados todavía.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Editar Contacto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <input type="hidden" id="editContactoId">
          <div class="mb-3">
              <label for="editNombre" class="form-label">Nombre Empresa</label>
              <input type="text" class="form-control" id="editNombre" required>
          </div>
          <div class="mb-3">
              <label for="editCorreo" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="editCorreo" required>
          </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarEdicion()">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast for Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">
        Operación exitosa.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const editModal = new bootstrap.Modal(document.getElementById('editModal'));
    const toastEl = document.getElementById('liveToast');
    const toast = new bootstrap.Toast(toastEl);
    
    function showToast(message, isError = false) {
        document.getElementById('toastMessage').innerText = message;
        toastEl.classList.remove('bg-success', 'bg-danger');
        toastEl.classList.add(isError ? 'bg-danger' : 'bg-success');
        toast.show();
    }

    // CRUD: Abrir Modal
    function abrirModalEdicion(id) {
        const row = document.getElementById('row-' + id);
        const nombre = row.querySelector('.td-nombre').innerText;
        const correo = row.querySelector('.td-correo').innerText;

        document.getElementById('editContactoId').value = id;
        document.getElementById('editNombre').value = nombre;
        document.getElementById('editCorreo').value = correo;

        editModal.show();
    }

    // CRUD: Guardar Edición usando Fetch API
    function guardarEdicion() {
        const id = document.getElementById('editContactoId').value;
        const nombre = document.getElementById('editNombre').value;
        const correo = document.getElementById('editCorreo').value;

        fetch(`/api/admin/contactos/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombreEmpresa: nombre, correo: correo })
        })
        .then(response => {
            if (!response.ok) throw new Error('Error al actualizar');
            return response.json();
        })
        .then(data => {
            // Actualizar fila dinámicamente
            const row = document.getElementById('row-' + id);
            row.querySelector('.td-nombre').innerText = nombre;
            row.querySelector('.td-correo').innerText = correo;
            editModal.hide();
            showToast('✅ Contacto actualizado correctamente.');
        })
        .catch(error => {
            showToast('❌ Error al actualizar contacto.', true);
            console.error(error);
        });
    }

    // Lanzar Ciclo de Cobranza a n8n
    function lanzarCicloCobranza() {
        const btn = document.getElementById('btnIniciarBatch');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...';

        fetch('/api/test/siigo/sharepoint/procesar-lote', {
            method: 'GET'
        })
        .then(response => {
            // If the endpoint is asynchronous, it might return quickly, or it might take a moment.
            if (!response.ok) throw new Error('Error en el pipeline de n8n');
            return response.text();
        })
        .then(data => {
            showToast('🚀 ' + (data || 'Ciclo de cobranza iniciado exitosamente.'));
        })
        .catch(error => {
            showToast('⚠️ Hubo un fallo iniciando el ciclo.', true);
            console.error(error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-play-circle me-2"></i> Iniciar Ciclo de Cobranza';
        });
    }
</script>

</body>
</html>
